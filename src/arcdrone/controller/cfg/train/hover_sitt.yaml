# @package _global_


# ^^^
# |||   Tell Hydra to place everything in this YAML file at the root 
#       of the config instead of under a nested key:


train: 

  use_sitt: true
  # HARDCODED: align_optimizer is adam and lr is 1e-4
  # HARDCODED: wrap_env
  align_updates_per_trigger: 1 # Number of optimization steps to take when triggered
  align_freq: 1 # opt updates of teacher vs student. E.g align_freq=10 means 10 teacher opt updates per student
  align_batch_ratio_per_device: 0.1 # Fraction of per-device rollout sampled for each alignment trigger
  proxy_kl_coef: 1.9
  sitt_align_coef: 0.01



  # Network Architecture
  proxy_hidden_layers: [512, 512, 256, 128]
  student_hidden_layers: [512, 512, 256, 128]
  action_hidden_layers: [512, 512, 256, 128]
  policy_hidden_layers: [512, 512, 256, 128]
  value_hidden_layers: [512, 512, 256, 128]
  policy_obs_key: "state"
  value_obs_key: "privileged_state"

  # WandB Configuration
  use_wandb: true
  wandb_project: "brax-training"
  wandb_run_name: "arcdrone_hover_sitt_run"


defaults:

  - default_ppo



  