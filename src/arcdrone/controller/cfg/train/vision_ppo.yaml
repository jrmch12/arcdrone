# @package _global_


# ^^^
# |||   Tell Hydra to place everything in this YAML file at the root 
#       of the config instead of under a nested key:


train:

  use_sitt: false

  # Vision mode: obs dict only has "pixels/view_0", no state/privileged_state
  # Empty strings tell VisionMLP to skip the state branch (use pixels only)
  policy_obs_key: ""
  value_obs_key: ""

  num_envs: 1024

  
  # WandB Configuration
  wandb_project: "brax-training"
  wandb_run_name: "arcdrone_hover_ppo_run"

defaults:

  - default_ppo

