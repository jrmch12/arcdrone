task_name: vision_landing_sitt

defaults:
  - override hydra/job_logging: default  
  - override hydra/hydra_logging: default  
  - _self_


hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}


env:

  # ---- Flags ----
  enable_vision_obs: true
  
  # ---- MJXEnvs / mujoco_playground flags ----
  xml_path_rel: "assets/skydio_x2/scene_mounted_cam.xml"
  impl: "warp"
  sim_dt: 0.004
  ctrl_dt: 0.02
  action_repeat: 1
  naconmax: ${mul:${env.njmax},${train.num_envs}}
  naccdmax: 300 # ${mul:${env.njmax},${train.num_envs}}
  njmax: 380
  vision: true
  vision_config:
    nworld: ${train.num_envs}
    cam_res: [64, 64]
    use_textures: true
    use_shadows: false
    enabled_geom_groups: [0, 1]
    cam_active: [true]
    render_rgb: [true]
    render_depth: [false]

  # ---- Grayscale + frame diffs (match DAgger) ----
  grayscale_obs: true
  use_frame_diffs: true
  frame_skip: 2

  # ---- Task specific ----
  buffer_size: 3
  buffer_size_pixels: 5

  # Episode control
  max_episode_steps: ${train.episode_length}
  success_threshold: 0.03
  success_steps_required: 10
  
  # Reward function
  distance_weight: 1 
  distance_scale: 0.3
  overshoot_penalty: 5
  oscillation_penalty: 2
  action_chattering_weight: 0.001
  action_penalty_weight: 0.0001
  time_penalty: 0.01 
  success_bonus: 0.5
  ground_penalty_weight: 10.0  
  ground_threshold_event: 0.2  
  ground_threshold_penalty: 0.5 
  camera_alignment_weight: 1.0

  # Reset ranges (scalars expected by the env)
  init_xy_range: 3.0
  init_z_min: 0.3
  init_z_max: 5.0
  init_linvel_std: 0.3
  init_angvel_std: 0.3
  init_tilt_range: 0.15


train:

  # ---- PPO Hyperparameters ----
  num_timesteps: 50_000_000
  num_evals: 20
  num_eval_envs: 64
  reward_scaling: 0.1          
  episode_length: 500
  normalize_observations: true
  action_repeat: 1
  unroll_length: 10
  num_minibatches: 16           
  num_updates_per_batch: 8      
  log_training_metrics: false   
  discounting: 0.97            
  learning_rate: 3e-4
  entropy_cost: 1e-3   
  learning_rate_schedule: 'ADAPTIVE_KL'
  desired_kl: 0.07
  max_grad_norm: 0.5        
  num_envs: 512
  batch_size: 512               
  seed: 0

  # ---- SITT Hyperparameters ----
  align_num_epochs: 200
  align_num_envs: 256
  align_unroll_length: 4 # ${train.unroll_length}
  align_num_splits: 10
  align_batch_size: 128
  align_num_minibatches: 2
  align_updates_per_trigger: 4
  use_sitt: true
  proxy_kl_coef: 5.0
  sitt_align_coef: 0.1
  align_learning_rate: 1e-4
  align_embed_coef: 0.3
  align_action_coef: 2.0

  # ---- Network Architecture ----
  teacher_dec_hidden_layers: [512, 512, 256, 128]
  proxy_hidden_layers: [512, 512, 256, 128]
  policy_dec_hidden_layers: [256, 128]
  policy_proprio_proj_hidden_layers: [64]
  action_hidden_layers: [512, 512, 256, 128]
  value_hidden_layers: [512, 512, 256, 128]
  cnn_num_filters: [32, 64, 64]
  cnn_kernel_sizes: [[8, 8], [4, 4], [3, 3]]
  cnn_strides: [[4, 4], [2, 2], [1, 1]]
  policy_pixels_key: "pixels/view_0"
  policy_proprio_key: "proprio_obs"
  value_obs_key: "value_obs"
  teacher_obs_key: "teacher_obs"
  policy_obs_key: "teacher_obs"

  # ---- Wandb ----
  use_wandb: false
  wandb_project: "arcdrone-sitt-mounted"
  wandb_run_name: null

  # ---- Checkpoint ----
  restore_params_path: null
  restore_value_fn: true
  frompreviouscheckpoint: 0
  teacher_checkpoint_path: null

