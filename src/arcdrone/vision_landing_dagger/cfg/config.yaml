task_name: new_attempt_2_dagger

defaults:
  - override hydra/job_logging: default  
  - override hydra/hydra_logging: default  
  - _self_


hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}


env:

  # DEBUG flags
  enable_vision_obs: true
  grayscale_obs: true
  
  # ==== MJXEnvs / mujoco_playground flags ====
  xml_path_rel: "assets/skydio_x2/scene_mounted_cam.xml"
  impl: "warp"
  sim_dt: 0.004
  ctrl_dt: 0.02
  action_repeat: 1
  naconmax: ${mul:${env.njmax},${train.num_envs}}
  njmax: 280
  vision: true

  # ==== 3DGS rendering config ====
  gs:
    scene_path: "assets/gs/scene.ply"
    cam_res: [64, 64]
    background: [0.5, 0.7, 0.95]
  
  # ==== Task specific ====
  buffer_size: 3        # depth of the privileged-state buffers (teacher_obs, proprio_obs, etc.) — must match teacher checkpoint
  buffer_size_pixels: 5 # depth of the pixel frame stack (student CNN input) — independent of teacher
  frame_skip: 2        # temporal spacing: frames in the stack are frame_skip steps apart
  use_frame_diffs: true # append frame-difference channels (optical flow proxy) to pixel obs
  landing_radius: 0.4

  # # Reset randomization — wider spread for impressive demo
  # init_xy_range: 3.0
  # init_z_min: 0.3
  # init_z_max: 5.0
  # init_tilt_range: 0.5
  # init_linvel_std: 0.9
  # init_angvel_std: 0.9

    # Reset randomization — wider spread for impressive demo. Evaluation:
  init_xy_range: 3.0
  init_z_min: 0.3
  init_z_max: 5.0
  init_tilt_range: 0.15
  init_linvel_std: 0.3
  init_angvel_std: 0.3

  # Episode control
  max_episode_steps: ${train.episode_length}
  success_threshold: 0.03
  success_steps_required: 10
  
  # Reward function
  distance_weight: 1 
  distance_scale: 0.3
  overshoot_penalty: 5
  oscillation_penalty: 2
  action_chattering_weight: 0.001
  action_penalty_weight: 0.0001
  time_penalty: 0.01 
  success_bonus: 60.0
  ground_penalty_weight: 10.0  
  ground_threshold_event: 0.15
  ground_threshold_penalty: 0.5
  camera_alignment_weight: 0.3

train:

  # ---- DAgger Hyperparameters ----
  num_timesteps: 100
  num_evals: 2
  num_eval_envs: 1
  episode_length: 200
  normalize_observations: true
  action_repeat: 1
  unroll_length: 4
  learning_rate: 1e-4
  max_grad_norm: 0.5
  num_envs: 2
  seed: 0
  teacher_checkpoint_path: "checkpoints/teacher_model.pkl"
  teacher_normalizer_key: "teacher_obs"  # SITT checkpoints use "teacher_obs"; privileged-RL use "policy_obs"
  num_dagger_epochs: 3              # just enough to verify end-to-end

  # DAgger mixing schedule: high beta_end keeps teacher guidance active
  beta_start: 1.0
  beta_end: 0.5
  beta_schedule: "cosine"

  # Minibatch layout (mirrors PPO / IL):
  batch_size: 4
  num_minibatches: 1
  align_updates_per_trigger: 1
  align_embed_coef: 0.3
  align_action_coef: 2.0
  aux_vel_coef: 1.0

  # Network Architecture
  policy_dec_hidden_layers: [256, 128]
  policy_proprio_proj_hidden_layers: [64]
  action_hidden_layers: [512, 512, 256, 128]
  value_hidden_layers: [512, 512, 256, 128]
  cnn_num_filters: [32, 64, 64]
  cnn_kernel_sizes: [[8, 8], [4, 4], [3, 3]]
  cnn_strides: [[4, 4], [2, 2], [1, 1]]
  policy_pixels_key: "pixels/view_0"
  policy_proprio_key: "proprio_obs"
  value_obs_key: "value_obs"
  teacher_obs_key: "teacher_obs"
  teacher_dec_hidden_layers: [512, 512, 256, 128]

  # Train from checkpoint
  restore_params_path: null
  frompreviouscheckpoint: 0

  # WandB Configuration
  wandb_project: "brax-training"
  wandb_run_name: "arcdrone_vision_landing_dagger_run"
  use_wandb: false
