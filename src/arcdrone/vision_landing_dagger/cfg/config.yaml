task_name: vision_landing_dagger

defaults:
  - override hydra/job_logging: default  
  - override hydra/hydra_logging: default  
  - _self_


hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}


env:

  # DEBUG Debugging flags
  enable_vision_obs: true
  
  # ==== MJXEnvs / mujoco_playground flags ====
  xml_path_rel: "assets/skydio_x2/scene.xml"
  impl: "warp"
  sim_dt: 0.004
  ctrl_dt: 0.02
  action_repeat: 1
  naconmax: ${mul:${env.njmax},${train.num_envs}}
  njmax: 250
  vision: true
  vision_config:
    nworld: ${train.num_envs}
    cam_res: [128, 128]
    use_textures: true
    use_shadows: false
    enabled_geom_groups: [0, 1, 2]
    cam_active: [true, true, true]
    render_rgb: [true, true, true]
    render_depth: [false, false, false]
  
  # ==== Task specific ====
  buffer_size: 3

  # Episode control
  max_episode_steps: ${train.episode_length}
  success_threshold: 0.08
  success_steps_required: 10
  
  # Reward function
  distance_weight: 1 
  distance_scale: 0.3
  overshoot_penalty: 5
  oscillation_penalty: 2
  action_chattering_weight: 0.001
  action_penalty_weight: 0.0001
  time_penalty: 0.01 
  success_bonus: 0.5
  ground_penalty_weight: 10.0  
  ground_threshold_event: 0.2  
  ground_threshold_penalty: 0.5 

train:

  # ---- DAgger Hyperparameters ----
  num_timesteps: 100
  num_evals: 8
  num_eval_envs: 2
  episode_length: 200
  normalize_observations: true
  action_repeat: 1
  unroll_length: 10
  learning_rate: 1e-3
  num_envs: 256
  seed: 0
  teacher_checkpoint_path: null   # REQUIRED — path to the teacher .pkl
  num_dagger_epochs: 200          # number of collect-then-align cycles

  # DAgger mixing schedule: β decays linearly from beta_start to beta_end
  # β = probability of using teacher action during rollout
  # β=1.0 → pure teacher rollout (like IL epoch 0)
  # β=0.0 → pure student rollout
  beta_start: 1.0
  beta_end: 0.0

  # Minibatch layout (mirrors PPO / IL):
  batch_size: 256
  num_minibatches: 4
  align_updates_per_trigger: 4

  # Network Architecture
  policy_dec_hidden_layers: [256, 128]
  policy_proprio_proj_hidden_layers: [64]
  action_hidden_layers: [512, 512, 256, 128]
  value_hidden_layers: [512, 512, 256, 128]
  cnn_num_filters: [32, 64, 64]
  cnn_kernel_sizes: [[8, 8], [4, 4], [3, 3]]
  cnn_strides: [[4, 4], [2, 2], [1, 1]]
  policy_pixels_key: "pixels/view_0"
  policy_pixels_key_1: "pixels/view_1"
  policy_proprio_key: "proprio_obs"
  value_obs_key: "value_obs"
  teacher_obs_key: "teacher_obs"
  teacher_dec_hidden_layers: [512, 512, 256, 128]

  # Train from checkpoint
  restore_params_path: null
  frompreviouscheckpoint: 0

  # WandB Configuration
  wandb_project: "brax-training"
  wandb_run_name: "arcdrone_vision_landing_dagger_run"
  use_wandb: false
