env:
  hola: 123
  xml_path_rel: assets/skydio_x2/scene.xml
  impl: jax
  sim_dt: 0.004
  ctrl_dt: 0.02
  action_repeat: 1
  nconmax: 0
  njmax: 2
  vision: false
  vision_config:
    gpu_id: 0
    render_batch_size: 1
    render_width: 64
    render_height: 64
    enabled_geom_groups:
    - 0
    use_rasterizer: false
    history: 3
  buffer_size: 5
  max_episode_steps: ${..train.episode_length}
  success_threshold: 0.02
  success_steps_required: 10
  distance_weight: 1
  distance_scale: 0.3
  overshoot_penalty: 5
  oscillation_penalty: 2
  action_chattering_weight: 0.001
  action_penalty_weight: 0.0001
  time_penalty: 0.01
  success_bonus: 50.0
  ground_penalty_weight: 10.0
  ground_threshold_event: 0.15
  ground_threshold_penalty: 0.5
  linacc_noise: 0.02
  quat_noise: 0.001
  angvel_noise: 0.01
  linvel_noise: 0.01
task_name: hover
train:
  num_timesteps: 10000000
  num_evals: 30
  reward_scaling: 0.1
  episode_length: 200
  normalize_observations: true
  action_repeat: 1
  unroll_length: 16
  num_minibatches: 2
  num_updates_per_batch: 4
  log_training_metrics: false
  discounting: 0.97
  learning_rate: 0.0003
  entropy_cost: 0.001
  num_envs: 256
  batch_size: 2048
  seed: 0
  restore_params_path: null
  restore_value_fn: true
  frompreviouscheckpoint: 0
  use_sitt: true
  align_update_every_env_steps: 100000
  align_batch_env_steps: 20000
  align_updates_per_trigger: 4
  proxy_kl_coef: 1.9
  sitt_align_coef: 0.01
  proxy_hidden_layers:
  - 512
  - 512
  - 256
  - 128
  student_hidden_layers:
  - 512
  - 512
  - 256
  - 128
  action_hidden_layers:
  - 512
  - 512
  - 256
  - 128
  policy_hidden_layers:
  - 512
  - 512
  - 256
  - 128
  value_hidden_layers:
  - 512
  - 512
  - 256
  - 128
  policy_obs_key: state
  value_obs_key: privileged_state
  use_wandb: true
  wandb_project: brax-training
  wandb_run_name: arcdrone_hover_sitt_run
debug_cpu: false
