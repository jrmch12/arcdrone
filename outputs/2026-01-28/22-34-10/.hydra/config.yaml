name: arcdrone
file_path: task/arcdrone.py
env:
  numEnvs: 2
  n_frames: 5
  backend: mjx
  xml_path_rel: assets/skydio_x2/scene.xml
  eval_mode: false
  buffer_size: 5
  max_episode_steps: 200
  success_threshold: 0.02
  success_steps_required: 10
  distance_weight: 1.0
  distance_scale: 5.0
  overshoot_penalty: 5.0
  oscillation_penalty: 2.0
  action_chattering_weight: 0.001
  action_penalty_weight: 0.0001
  time_penalty: 0.01
  success_bonus: 50.0
  linacc_noise: 0.02
  quat_noise: 0.001
  angvel_noise: 0.01
  linvel_noise: 0.01
train:
  num_timesteps: 10000000
  num_evals: 5
  reward_scaling: 0.1
  episode_length: ${env.max_episode_steps}
  normalize_observations: true
  action_repeat: 1
  unroll_length: 32
  num_minibatches: 2
  num_updates_per_batch: 4
  discounting: 0.97
  learning_rate: 0.0003
  entropy_cost: 0.001
  num_envs: 1024
  batch_size: 4096
  seed: 0
  policy_hidden_layers:
  - 512
  - 512
  - 256
  - 128
  value_hidden_layers:
  - 512
  - 512
  - 256
  - 128
  policy_obs_key: state
  value_obs_key: privileged_state
  use_wandb: false
  wandb_project: brax-training
  wandb_run_name: arcdrone_vel_ppo_run
  restore_params_path: null
  restore_value_fn: true
debug_cpu: false
