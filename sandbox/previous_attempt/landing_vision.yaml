# @package _global_
name: landing_vision
file_path: task/landing_vision.py


env:
  
  
  # ==== Mjc Playground Pipeline ====



  sim_dt: 0.004  
  ctrl_dt: 0.02
  episode_length: ${int(4 / env.ctrl_dt)} # x seconds
  num_envs: 2
  action_repeat: 1 # check
  impl: "jax"  
  # nconmax= None  I think this two variables are only neccesary for warp.
  # njmax= None
  vision: False

  # Mjc XML override

  opt:
    timestep: ${env.sim_dt}
    mj_solver: "cg" # newton, etc
    mj_iterations: 6
    mj_ls_iterations: 6


  vision_config:

    gpu_id: 0
    render_batch_size: ${env.num_envs}
    render_width: 64
    render_height: 64
    enabled_geom_groups: [0, 1, 2] # check what gets render!
    use_rasterizer: False
    history: 5 # this is a high level flag. Could be in Own flags as vision_buffer
    # There are more flags to check in the renderer method.

  
  
  # ==== Own Flags ====

  eval_mode: False

  #
  buffer_size: 5

  # Episode control
  max_episode_steps: 200   
  success_threshold: 0.02
  success_steps_required: 10
  
  # Reward function
  distance_weight: 1 
  distance_scale: 5  # exponential          
  overshoot_penalty: 5
  oscillation_penalty: 2
  action_chattering_weight: 0.001
  action_penalty_weight: 0.0001
  time_penalty: 0.01 
  success_bonus: 50.0
  ground_penalty_weight: 100.0  
  ground_threshold: 0.1  

  # Sensor noise
  linacc_noise: 0.02  # m/s²
  quat_noise: 0.001   # dimensionless
  angvel_noise: 0.01  # rad/s
  linvel_noise: 0.01  # m/s
  



train:

# ==== Brax Training Pipeline ====

  # PPO Hyperparameters
  num_timesteps: 100 # 20_000_000
  num_evals: 5
  reward_scaling: 0.1
  episode_length: ${env.max_episode_steps}
  normalize_observations: true
  action_repeat: 1
  unroll_length: 10
  num_minibatches: 24
  num_updates_per_batch: 8
  discounting: 0.97
  learning_rate: 3e-4
  entropy_cost: 1e-3
  num_envs: ${env.numEnvs}
  batch_size: 512
  seed: 0

  
  # Network Architecture
  policy_hidden_layers: [512, 512, 256, 128]
  value_hidden_layers: [512, 512, 256, 128]
  policy_obs_key: "state"
  value_obs_key: "privileged_state"

  
  # WandB Configuration
  use_wandb: true
  wandb_project: "brax-training"
  wandb_run_name: "arcdrone_vel_ppo_run"

  
  # Train from checkpoint (for continuing training)
  restore_params_path: null      
  restore_value_fn: true    

  



