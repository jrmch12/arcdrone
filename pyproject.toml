[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcdrone"
version = "0.1.0"
description = "A reinforcement learning controller for the quadcopter of the Universidad de Piura ARC team"
authors = [{name = "Jose Mares", email = "josermch12@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wandb>=0.16.0",
    "hydra-core>=1.3.0",
    "pyzmq>=25.0.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
ml = [
    "mujoco>=3.0.0",
    "mujoco_mjx>=3.0.0",
    "brax>=0.10.0",
    "jax[cuda12]>=0.4.0",
    "omegaconf>=2.3.0",
]
cad = [
    "onshape-to-robot>=0.4.0",
    "pymeshlab>=2025.7,<2026.0",
]

[project.scripts]

arcdrone-train-ppo = "arcdrone.controller.rl.scripts.train:main"
arcdrone-train-sitt = "arcdrone.controller.sitt.scripts.train:main"
arcdrone-evaluate-ppo = "arcdrone.controller.rl.scripts.evaluate:main"
arcdrone-evaluate-sitt = "arcdrone.controller.sitt.scripts.evaluate:main"


[tool.setuptools.packages.find]
where = ["src"]

